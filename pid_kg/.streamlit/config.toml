# Dark "control room" theme for app.py. Fonts load from Google Fonts and fall back to system fonts offline.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#060a13"
secondaryBackgroundColor = "#0e1626"
textColor = "#dbe4f0"
linkColor = "#67e8f9"
borderColor = "#1c2a40"
dataframeBorderColor = "#1c2a40"
dataframeHeaderBackgroundColor = "#0b1322"
codeBackgroundColor = "#0b1322"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
blueColor = "#38bdf8"
greenColor = "#34d399"
yellowColor = "#fbbf24"
orangeColor = "#fb923c"
redColor = "#f87171"
violetColor = "#c084fc"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap, monospace"
chartCategoricalColors = ["#22d3ee", "#fbbf24", "#c084fc", "#34d399", "#f472b6", "#38bdf8", "#fb923c"]

[theme.sidebar]
backgroundColor = "#080e1a"
secondaryBackgroundColor = "#0e1626"
borderColor = "#1c2a40"
