# Embedded in a WinCC OA UI frame: its browser drops the XSRF cookie, which gives "AxiosError 403" on upload.
# Only use on a trusted network / localhost.
[server]
enableXsrfProtection = false
enableCORS = false

[client]
toolbarMode = "minimal"

# Siemens iX dark theme for app.py (see ui_style.py). Siemens Sans is used when installed; falls back to system fonts.
[theme]
base = "dark"
primaryColor = "#00ffb9"
backgroundColor = "#000028"
secondaryBackgroundColor = "#0f1b3f"
textColor = "#ffffff"
linkColor = "#00ffb9"
borderColor = "#2b3a63"
dataframeBorderColor = "#2b3a63"
dataframeHeaderBackgroundColor = "#0f1b3f"
codeBackgroundColor = "#0f1b3f"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
blueColor = "#00bedc"
greenColor = "#00cc00"
yellowColor = "#ffd732"
orangeColor = "#ff9200"
redColor = "#ff2640"
violetColor = "#a78bfa"
font = "Siemens Sans, Segoe UI, Arial, sans-serif"
headingFont = "Siemens Sans, Segoe UI, Arial, sans-serif"
codeFont = "Consolas, monospace"
chartCategoricalColors = ["#00ffb9", "#ffd732", "#00bedc", "#a78bfa", "#ff9200", "#ff6b9d", "#00cc00"]

[theme.sidebar]
backgroundColor = "#0f1b3f"
secondaryBackgroundColor = "#000028"
borderColor = "#2b3a63"
